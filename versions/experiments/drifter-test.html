<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onion Head: top-down test</title>
<style>
:root{--bg:#ece8f7;--ink:#241845;--dim:#6b6091;--btn:#1c1240;--btnink:#eeeaff;--cy:#12b8ac;--mg:#e0147a;--yl:#c9a200;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070618;--ink:#dcd6ff;--dim:#7c72a8;--btn:#150f36;--btnink:#e6e1ff;--cy:#19d6c8;--mg:#ff2d96;--yl:#ffd23a}}
:root[data-theme="dark"]{--bg:#070618;--ink:#dcd6ff;--dim:#7c72a8;--btn:#150f36;--btnink:#e6e1ff;--cy:#19d6c8;--mg:#ff2d96;--yl:#ffd23a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#view{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0a0b2a;outline:none;cursor:crosshair}
#view:focus-visible{outline:2px solid var(--cy);outline-offset:4px}
#keys{margin:0 auto 12px;max-width:92ch;padding:0 16px;text-align:center;color:var(--dim)}
#keys b{color:var(--ink);font-weight:600}
#pad{display:none}
body.touch #keys{display:none}
body.touch #pad{display:flex;justify-content:space-between;align-items:center;height:180px;flex:none;padding:0 18px 16px}
#joy{position:relative;width:128px;height:128px;border-radius:50%;border:2px solid var(--cy);background:color-mix(in srgb,var(--btn) 70%,transparent);touch-action:none}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:var(--cy);opacity:.8;pointer-events:none}
.btns{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px}
.btns button{font:inherit;font-size:11px;color:var(--btnink);background:var(--btn);border:2px solid var(--cy);border-radius:50%;touch-action:none;padding:0}
.btns button.on{background:var(--cy);color:#070618}
.btns .slash{border-color:var(--mg)}.btns .shoot{border-color:var(--yl)}
@media (orientation:landscape){
  body.touch #pad{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:auto;pointer-events:none;opacity:.6;padding:0 18px 12px}
  body.touch #pad>*{pointer-events:auto}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="view" width="480" height="270" tabindex="0" aria-label="Onion Head top-down test scene. Use the keyboard, mouse or a gamepad to play."></canvas></div>
  <p id="keys"><b>WASD</b> move &nbsp; <b>J / click</b> knife or punch (tap for a combo) &nbsp; <b>K / right-click</b> use a salvaged part &nbsp; <b>Space</b> hop (core) or guard (frame, tap just before a hit to parry) &nbsp; <b>E</b> nest into a frame, eject, rest, remember &nbsp; <b>hold H</b> repair with scrap &nbsp; <b>R</b> rain &nbsp; <b>M</b> music</p>
  <div id="pad">
    <div id="joy" aria-label="Move"><div id="knob"></div></div>
    <div class="btns">
      <button data-k="heal" aria-label="Repair">FIX</button>
      <button data-k="act" aria-label="Nest, eject or interact">E</button>
      <button class="shoot" data-k="shoot" aria-label="Use part">PART</button>
      <button data-k="dash" aria-label="Hop or guard" style="grid-column:2">HOP</button>
      <button class="slash" data-k="slash" aria-label="Attack">HIT</button>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const W=480,H=270,WW=960,WH=640;
const view=document.getElementById('view'),vx=view.getContext('2d');vx.imageSmoothingEnabled=false;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const scene=mk(W,H),g0=scene.getContext('2d');let g=g0;
const lightC=mk(W,H),lg=lightC.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch=matchMedia('(pointer:coarse)').matches;if(touch)document.body.classList.add('touch');

// ---------- palette: neon over desaturated blue ----------
const C={night:'#0a0b2a',deep:'#141a52',g0:'#141c62',g1:'#1b2a86',g2:'#2440ac',g3:'#3862d6',g4:'#5d8cf0',
  p0:'#2b4cbc',p1:'#3a62d4',p2:'#5a86ea',p3:'#8fb4ff',
  fl0:'#2f8bff',fl1:'#6ad4ff',fl2:'#e6fbff',
  m0:'#2a0330',m1:'#6a0a4c',m2:'#b80e72',m3:'#ff2d96',m4:'#ff9ad0',
  s0:'#3b4270',s1:'#7380ad',s2:'#b2bed8',s3:'#eaf2f8',
  t0:'#073c48',t1:'#0e8f9a',t2:'#19d6c8',t3:'#9ffff0',
  w0:'#06384a',w1:'#0b6d6a',w2:'#14a88a',w3:'#2ee6b0',w4:'#b8ffe4',
  f0:'#ff4a1f',f1:'#ffb02a',f2:'#fff3b0',
  red:'#ff3b5c',yl:'#ffd23a',wh:'#f4fbff',cy:'#00f0ff',hp:'#4dffc0',hpHi:'#c8fff0'};
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
let ghostCol=null;
const px=(x,y,w,h,c)=>{g.fillStyle=ghostCol||c;g.fillRect(Math.round(x),Math.round(y),w,h);};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
const srand=s=>()=>(s=(s*16807)%2147483647)/2147483647;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967295;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const fbm=(x,y)=>vnoise(x,y)*.6+vnoise(x*2.1+7,y*2.1)*.3+vnoise(x*4.3,y*4.3+3)*.1;
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],bay=(x,y)=>(BAYER[(y&3)*4+(x&3)]+.5)/16;

// ---------- 3x5 pixel font ----------
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100110101010','7':'111001010010010','8':'010101010101010','9':'010101011001110',':':'000010000010000','-':'000000111000000','.':'000000000000010','!':'010010010000010'};
const textW=(s,sc=1)=>String(s).length*4*sc-sc;
function txt(s,x,y,col,sc=1,al='l'){s=String(s).toUpperCase();const w=textW(s,sc);if(al==='c')x-=w>>1;else if(al==='r')x-=w;let cx=Math.round(x);g.fillStyle=col;for(const ch of s){const d=FONT[ch];if(d)for(let i=0;i<15;i++)if(d[i]==='1')g.fillRect(cx+(i%3)*sc,Math.round(y)+((i/3)|0)*sc,sc,sc);cx+=4*sc;}}

// ---------- world layout ----------
const shoreX=y=>235+26*Math.sin(y/53)+14*Math.sin(y/19+1)+(y>520?(y-520)*.5:0);
const isLake=(x,y)=>x<shoreX(y)-2;
const PZ={x:372,y:196,w:240,h:228};
const FIRE={x:700,y:474},NPC={x:716,y:468},START={x:676,y:494},MONO={x:492,y:312};
const world=mk(WW,WH),wc=world.getContext('2d');
const solids=[];const props=[];
const glowPts=[]; // static glowing points {x,y,r,col,a}

// ---------- pixel-art blob renderer: shaded, dithered, outlined, dripping ----------
function blob(w,h,circles,tones,outline,opt={}){
  const c=mk(w,h),x=c.getContext('2d'),id=x.createImageData(w,h),d=id.data,N=tones.length,T=tones.map(rgb),O=rgb(outline);
  const m=new Int8Array(w*h).fill(-1),Lx=-.45,Ly=-.7,Lz=.55,seed=opt.seed||0;
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
    let best=-1,nx=0,ny=0,nz=0;
    for(const cc of circles){const dx=(xx+.5-cc[0])/cc[2],dy=(y+.5-cc[1])/cc[2],dd=dx*dx+dy*dy;if(dd<1){const hh=(1-dd)*cc[2];if(hh>best){best=hh;nx=dx;ny=dy;nz=Math.sqrt(1-dd);}}}
    if(best<0)continue;
    const l=nx*Lx+ny*Ly+nz*Lz,v=l*.55+.42+(hash(xx*7+seed,y*13)-.5)*(opt.noise??.2);
    m[y*w+xx]=clamp(Math.floor(v*N+(bay(xx,y)-.5)*.9),0,N-1);
  }
  const set=(i,col)=>{d[i*4]=col[0];d[i*4+1]=col[1];d[i*4+2]=col[2];d[i*4+3]=255;};
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
    const i=y*w+xx;if(m[i]<0)continue;
    const edge=xx===0||y===0||xx===w-1||y===h-1||m[i-1]<0||m[i+1]<0||m[i-w]<0||m[i+w]<0;
    const topEdge=y>0&&m[i-w]<0;
    set(i,edge&&!(topEdge&&m[i]>=N-2)?O:T[m[i]]);
  }
  if(opt.drip){
    for(let xx=1;xx<w-1;xx++)for(let y=h-2;y>=0;y--){
      const i=y*w+xx;if(m[i]<0||m[i+w]>=0)continue;
      if(hash(xx+seed,y*3)<opt.drip){const L=1+Math.floor(hash(xx,y+seed)*opt.dripLen);for(let k=1;k<=L&&y+k<h;k++)set((y+k)*w+xx,k===L?T[Math.min(N-1,2)]:T[1]);}
      break;
    }
  }
  if(opt.sparkle){const S=rgb(opt.sparkle);for(let k=0;k<(opt.sparkN||6);k++){const xx=(hash(k,seed)*w)|0,y=(hash(seed,k*5)*h)|0;if(m[y*w+xx]>=1)set(y*w+xx,S);}}
  x.putImageData(id,0,0);return c;
}
const TREE_M=[C.m0,C.m1,C.m2,C.m3,C.m4],TREE_T=['#062a3a','#0b4f5e','#11808a','#1fb8b0','#7ff0e0'],BUSH_B=[C.g0,C.g1,C.g2,C.g3,C.g4],ROCK=[C.s0,C.s1,C.s2,C.s3];
function makeTree(seed,R,tones,outline,trunkCol){
  const sr=srand(seed*7919+13),trunkH=Math.round(R*.35)+4,w=Math.round(R*2.6)+10,h=R*2+trunkH+10,cx=w/2,cy=R+5;
  const circles=[[cx,cy,R]];
  for(let k=0;k<9;k++){const a=sr()*6.28,dd=R*(.35+.45*sr());circles.push([cx+Math.cos(a)*dd*1.15,cy+Math.sin(a)*dd*.55,R*(.4+sr()*.3)]);}
  const s=mk(w,h),c=s.getContext('2d'),by=h-4,top=Math.round(cy+R*.4);
  c.fillStyle=outline;c.fillRect(cx-3,top,6,by-top);c.fillRect(cx-5,by-2,10,3);
  c.fillStyle=trunkCol;c.fillRect(cx-2,top,3,by-top-1);c.fillRect(cx-4,by-2,3,2);
  c.drawImage(blob(w,h,circles,tones,outline,{drip:.34,dripLen:R*.7,seed,noise:.1,sparkle:tones[tones.length-1],sparkN:10}),0,0);
  return{spr:s,ax:Math.round(cx),ay:by};
}
function addProp(o){props.push(o);if(o.solid)solids.push(o.solid);}
function makePillar(ph){
  const w=16,h=ph+10,s=mk(w,h);g=s.getContext('2d');
  px(0,h-5,16,5,C.s0);px(1,h-7,14,3,C.s1);
  px(2,6,12,ph-4,C.s2);px(2,6,3,ph-4,C.s3);px(11,6,3,ph-4,C.s1);
  px(1,2,14,5,C.s3);px(1,6,14,1,C.s1);px(1,2,14,1,C.wh);
  for(let yy=14;yy<ph-8;yy+=16){px(4,yy,8,8,C.t0);px(5,yy+1,6,6,C.t1);px(6,yy+2,4,1,C.t3);px(6,yy+2,1,4,C.t3);px(8,yy+4,2,2,C.t3);}
  px(9,ph-12,1,6,C.s1);px(4,20,1,4,C.s1);
  for(let i=0;i<7;i++){const xx=2+i*2,L=2+((i*5)%6);px(xx,h-9-L,1,L,i%2?C.m2:C.g3);}
  g=g0;return s;
}
function makeShrine(){
  const w=40,h=48,s=mk(w,h);g=s.getContext('2d');
  px(2,h-6,36,6,C.s0);px(4,h-9,32,4,C.s1);px(4,h-9,32,1,C.s2);
  px(7,12,26,h-21,C.t1);px(7,12,5,h-21,C.t2);px(28,12,5,h-21,C.t0);
  px(3,6,34,7,C.t2);px(3,6,34,1,C.t3);px(3,12,34,1,C.t0);px(12,2,16,5,C.t1);px(12,2,16,1,C.t3);
  px(13,17,14,14,C.night);px(14,18,12,12,C.t0);
  px(16,20,8,1,C.t3);px(16,20,1,6,C.t3);px(19,23,3,3,C.t3);px(23,25,1,3,C.t3);
  px(10,34,4,4,C.t3);px(26,34,4,4,C.t3);
  g=g0;return s;
}
function makeWall(w,seed){
  const sr=srand(seed),hgt=26,h=hgt+18,s=mk(w,h);g=s.getContext('2d');
  const tops=[];for(let x=0;x<w;x+=4)tops.push(Math.round(sr()*10));
  for(let i=0;i<tops.length;i++){const x=i*4,t=tops[i];px(x,6+t,4,h-6-t-4,C.s2);px(x,6+t,4,3,C.s3);px(x,6+t,4,1,C.wh);}
  for(let y=16;y<h-6;y+=7)for(let x=(y%14?0:6);x<w;x+=12)px(x,y,1,6,C.s1);
  for(let y=16;y<h-6;y+=7)px(0,y,w,1,C.s1);
  px(0,h-5,w,1,C.s1);px(0,h-4,w,4,C.s0);
  for(let i=0;i<tops.length;i++){if(sr()<.45){const x=i*4,t=tops[i],L=3+((sr()*12)|0);px(x,5+t,4,3,C.m3);for(let k=0;k<4;k++)if(sr()<.7)px(x+k,8+t,1,(sr()*L)|0,k%2?C.m2:C.m3);}}
  px(Math.round(w*.3),22,2,3,C.t3);
  g=g0;return{spr:s,h};
}
function makeTitan(){
  const w=230,h=244,s=mk(w,h),c=s.getContext('2d');g=c;
  const TP=['#0c1430','#16284a','#223f64','#2f5f7c','#468c96','#78c6b8','#b8f4e2'];
  const dith=(x,y,bw,bh,a,b,split)=>{for(let yy=0;yy<bh;yy++)for(let xx=0;xx<bw;xx++){const t=yy/bh+(hash(x+xx,y+yy)-.5)*.25;px(x+xx,y+yy,1,1,t+(bay(x+xx,y+yy)-.5)*.3<split?a:b);}};
  const block=(x,y,bw,bh,dep)=>{
    dith(x+bw,y-dep,Math.round(dep*.7),bh+dep,TP[2],TP[1],.5);
    dith(x,y,bw,bh,TP[4],TP[3],.45);
    dith(x,y-dep,bw,dep,TP[5],TP[4],.6);px(x,y-dep,bw,1,TP[6]);
    px(x,y,bw,1,TP[1]);
  };
  c.drawImage(blob(w,60,[[40,40,26],[90,36,30],[140,38,32],[190,42,26],[115,44,40]],['#0c1430','#16284a','#223f64','#2f5f7c','#468c96'],'#060a1c',{seed:3}),0,h-62);
  block(40,122,132,80,16);
  for(let i=0;i<5;i++)px(52,134+i*12,108,2,TP[1]);
  block(14,110,34,42,12);block(170,104,34,46,12);
  block(178,152,22,64,8);px(178,214,22,3,TP[0]);
  block(72,44,80,66,14);
  px(86,64,16,12,C.night);px(122,64,16,12,C.night);px(91,68,6,5,'#6a1040');px(127,68,6,5,'#6a1040');px(93,69,3,3,'#ff4fb0');px(129,69,3,3,'#ff4fb0');
  for(let i=0;i<4;i++)px(90,86+i*4,44,2,TP[1]);
  px(108,18,3,20,TP[2]);px(108,18,1,20,TP[4]);px(104,14,11,4,TP[3]);
  const moss=['#06303a','#0b5a5a','#138a7e','#22c0a0','#8ff0d0'];
  const mosses=[[60,20,[[20,14,14],[36,16,12],[10,17,9]],46,112],[64,30,[[18,20,16],[40,22,14],[56,18,12]],62,16],[40,24,[[14,14,12],[28,16,10]],26,90],[44,24,[[16,14,12],[30,16,10]],166,82],[40,24,[[14,14,11],[26,15,9]],30,190]];
  mosses.forEach(([mw,mh,cs,mx,my],i)=>c.drawImage(blob(mw,mh+24,cs,moss,'#021a20',{drip:.45,dripLen:22,seed:i*9+2,sparkle:C.m3,sparkN:4}),mx,my));
  for(let i=0;i<24;i++){const x=40+((hash(i,5)*140)|0),y=106+((hash(i,9)*30)|0),L=6+((hash(i,2)*34)|0);px(x,y,1,L,'#0b5a5a');px(x,y+L,1,2,'#22c0a0');}
  g=g0;return{spr:s,ax:115,ay:h-6};
}

// ---------- paint the world ----------
function paintGround(){
  const id=wc.createImageData(WW,WH),d=id.data;
  const G=[C.g0,C.g1,C.g2,C.g3].map(rgb),Wt=[C.w0,C.w1,C.w2,C.w3,C.w4].map(rgb),S=['#3558cc','#4a74e0','#86a8f6'].map(rgb),GR=rgb('#22398e'),TT=[rgb(C.t1),rgb(C.t3)];
  for(let y=0;y<WH;y++){const sx=shoreX(y);for(let x=0;x<WW;x++){
    const i=(y*WW+x)*4,b=bay(x,y),dd=sx-x;let c;
    if(dd>0){
      if(dd<2)c=Wt[4];
      else{let v=1-clamp(dd/190,0,1)*.9+(fbm(x/46,y/12)-.5)*.35;if(dd<8)v+=.3;c=Wt[clamp(Math.floor(v*4+(b-.5)*.8),0,3)];}
    }else{
      const n=fbm(x/70,y/70)*.86+fbm(x/12,y/12)*.14;
      c=G[clamp(Math.floor(n*4.2-.95+(dd>-12?.5:0)+(b-.5)*.6),0,3)];
      if(x>=PZ.x&&x<PZ.x+PZ.w&&y>=PZ.y&&y<PZ.y+PZ.h){
        const TH=18,TW=22,row=Math.floor((y-PZ.y)/TH),tx=x-PZ.x+(row%2)*11,col=Math.floor(tx/TW),lx=tx%TW,ly=(y-PZ.y)%TH;
        const broken=hash(col,row+99)<.24,over=fbm(x/28,y/28)>.64,glyph=hash(col+5,row+17)<.08;
        if(!broken&&!over){
          if(lx===0||ly===0)c=GR;else if(ly===TH-1||lx===TW-1)c=S[0];
          else if(glyph&&lx>5&&lx<16&&ly>4&&ly<13)c=(lx===7||ly===6||(lx>10&&ly>9&&lx<14))?TT[1]:TT[0];
          else{const t=hash(col,row)*.5+(ly<4?.35:0)+(lx<3?.15:0)+(b-.5)*.25;c=S[t>.7?2:t>.3?1:0];}
        }
      }
    }
    d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
  }}
  wc.putImageData(id,0,0);
  g=wc;const sr=srand(42);

let gpx=0,gpy=0;
function pollPad(){

  let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){pads=[];};let p=null;for(const x of pads)if(x){p=x;break;}if(!p)return;

// ---------- audio: detuned synth pads, glassy arps, delay ----------
let ac=null,master=null,musicOn=true,musicGain=null;
function initAudio(){
  if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);startMusic();
}
function startMusic(){
  musicGain=ac.createGain();musicGain.gain.value=.0001;musicGain.gain.exponentialRampToValueAtTime(1,ac.currentTime+4);musicGain.connect(master);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.Q.value=5;
  const pad=ac.createGain();pad.gain.value=.028;lp.connect(pad).connect(musicGain);
  const lfo=ac.createOscillator(),lfoG=ac.createGain();lfo.frequency.value=.06;lfoG.gain.value=380;lfo.connect(lfoG).connect(lp.frequency);lfo.start();
  const delay=ac.createDelay(1.5),fb=ac.createGain(),wet=ac.createGain();delay.delayTime.value=.46;fb.gain.value=.5;wet.gain.value=.5;delay.connect(fb).connect(delay);delay.connect(wet).connect(musicGain);
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const chords=[[45,57,60,64,67],[41,53,57,60,64],[36,48,55,59,64],[43,55,59,62,66]];
  const voices=[];for(let v=0;v<5;v++){const pair=[];for(const det of [-7,7]){const o=ac.createOscillator();o.type=v===0?'triangle':'sawtooth';o.detune.value=det;o.connect(lp);o.start();pair.push(o);}voices.push(pair);}
  let ci=0;const setChord=()=>{const ch=chords[ci%chords.length],t=ac.currentTime;voices.forEach((pair,v)=>pair.forEach(o=>o.frequency.setTargetAtTime(mtof(ch[v]),t,.8)));ci++;};
  setChord();setInterval(setChord,7000);
  setInterval(()=>{if(!musicOn||Math.random()<.4)return;const ch=chords[(ci+3)%chords.length],n=ch[1+((Math.random()*4)|0)]+(Math.random()<.5?12:24),t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
    o.type='triangle';o.frequency.value=mtof(n);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.05,t+.02);gn.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(gn);gn.connect(delay);gn.connect(musicGain);o.start(t);o.stop(t+1);},380);
}
function tone(f,d,type='square',v=.05,slide=0,delay=0){
  if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,type='lowpass',f=1200,f2=0,delay=0){
  if(!ac)return;const n=(ac.sampleRate*d)|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),gn=ac.createGain(),t=ac.currentTime+delay;s.buffer=b;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(gn).connect(master);s.start(t);
}

function kill(e){

function stepEnemy(e){

    case 'home':{const hx=e.hx-e.x,hy=e.hy-e.y,hd=Math.hypot(hx,hy);if(hd<3){e.st='dormant';e.hp=e.max;}else{e.vx=hx/hd*.6;e.vy=hy/hd*.6;e.fx=hx/hd;e.fy=hy/hd;}if(alive&&dist<70)e.st='chase';break;}

// ---------- world update ----------
function step(){
  T++;pollPad();computeKeys();
  if(PR.rain)raining=!raining;
  if(PR.mute&&musicGain){musicOn=!musicOn;musicGain.gain.setTargetAtTime(musicOn?1:.0001,ac.currentTime,.3);}

  if(mem){mem.t++;if((PR.act||PR.slash)&&mem.t>10){mem.i++;mem.t=0;SFX.page();if(mem.i>=3)mem=null;}PR.act=PR.slash=PR.shoot=false;}
  stepPlayer();
  for(const e of enemies.slice())stepEnemy(e);
  stepBombs();
  for(const b of beams)b.t--;beams=beams.filter(b=>b.t>0);
  for(const k of pickups){
    k.t++;if(k.z>0||k.vz>0){k.x+=k.vx;k.y+=k.vy;k.z+=k.vz;k.vz-=.2;if(k.z<=0){k.z=0;k.vz=0;k.vx=k.vy=0;}}
    const d=Math.hypot(pl.x-k.x,pl.y-k.y);
    if(k.t>20&&pl.state!=='dead'&&pl.z<3){
      if(k.kind==='scrap'&&d<9){k.got=1;pl.scrap++;SFX.pick();}
      else if(k.kind==='part'&&d<11&&pl.parts.length<3){k.got=1;pl.parts.push(k.part);SFX.part();say(PARTS[k.part].name,pl.x,pl.y-34,PARTS[k.part].col,80);}
    }
  }
  pickups=pickups.filter(k=>!k.got);
  for(const d of debris){d.x+=d.vx;d.y+=d.vy;d.z+=d.vz;d.vz-=.22;d.vx*=.97;d.vy*=.97;if(d.z<=0){d.z=0;if(d.vz<-1.2){d.vz*=-.35;}else{d.done=1;g=wc;px(d.x,d.y-d.h,d.w,d.h,d.c);px(d.x,d.y,d.w,1,'#0c103a');g=g0;}}}
  debris=debris.filter(d=>!d.done);
  for(const p of parts){if(p.ring){p.r+=2.2;p.t--;continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.97;p.t--;}
  parts=parts.filter(p=>p.t>0);
  for(const t of texts){t.y-=.35;t.t--;}texts=texts.filter(t=>t.t>0);
  if(T%3===0)parts.push({x:FIRE.x+rnd(-3,3),y:FIRE.y-6,vx:rnd(-.2,.2),vy:-rnd(.4,.9),t:rnd(20,40)|0,c:Math.random()<.5?C.f1:C.f2,g:-.005,s:1,glow:1});
  for(const m of motes){m.y-=m.v;m.x+=Math.sin(T*.01+m.p)*.15;if(m.y<-2){m.y=H+2;m.x=rnd(0,W);}}
  for(const f of flies){f.p+=.02;f.x+=Math.cos(f.p*1.3)*f.s;f.y+=Math.sin(f.p)*f.s*.6;}
  if(raining)for(const d of drops){d.x-=1.3;d.y+=d.v;if(d.y>H){if(Math.random()<.5)parts.push({splash:1,x:d.x+cam.x,y:d.y-rnd(0,120)+cam.y,t:6});d.y=rnd(-40,-4);d.x=rnd(0,W+60);}}
  if(raining&&--nextBolt<=0){nextBolt=rnd(500,1300);makeBolt();}
  if(lightning&&--lightning.t<=0)lightning=null;
  flash*=.86;redFlash*=.93;shake*=.82;if(shake<.3)shake=0;
  const tx=clamp(pl.x+pl.fx*24-W/2,0,WW-W),ty=clamp(pl.y-10+pl.fy*16-H/2,0,WH-H);
  cam.x+=(tx-cam.x)*.08;cam.y+=(ty-cam.y)*.08;
}
function makeBolt(){

  const pts=[[sx,-10]];let x=sx,y=-10;while(y<ey){y+=rnd(10,22);x+=rnd(-14,14)+(ex-x)*.15;pts.push([x,Math.min(y,ey)]);}

function drawFrame(x,y,type,fx,fy,pal,walk,moving,act){
  x=Math.round(x);y=Math.round(y);
  const f=FRAMES[type],dir=dirOf(fx,fy),s=fx>0?1:-1,sw=moving?Math.sin(walk*.3):0,la=moving&&Math.cos(walk*.3)>.3?1:0,lb=moving&&Math.cos(walk*.3)<-.3?1:0;
  const bob=moving&&Math.abs(sw)>.7?1:0,top=y-4-f.th+bob;
  px(x-f.tw/2+1,y-4,3,4-la,pal.dark);px(x+f.tw/2-4,y-4,3,4-lb,pal.dark);
  const ax=f.aw,ah=f.ah,swing=Math.round(sw*2);
  const armL=[x-f.tw/2-ax+1,top+1],armR=[x+f.tw/2-1,top+1];
  const punchSide=dir==='l'?'L':dir==='r'?'R':'R';
  const drawArm=(a,side,dark)=>{
    if(act&&act.punch&&side===punchSide){
      const cx=x+fx*(f.tw/2),cy=top+f.th/2+fy*3,L=act.len;
      for(let i=0;i<=L;i+=1)px(cx+fx*i-ax/2,cy+fy*i*.8-ax/2,ax,ax,pal.line);
      bx(cx+fx*L-2,cy+fy*L*.8-2,5,5,act.glove?{line:C.yl,fill:C.f1}:pal);return;
    }
    bx(a[0],a[1]+(side==='L'?swing:-swing),ax,ah,pal,dark);
  };
  if(dir==='u'){drawArm(armL,'L');drawArm(armR,'R');}
  else if(dir==='d'){drawArm(armL,'L',true);drawArm(armR,'R',true);}
  else drawArm(s>0?armL:armR,s>0?'L':'R',true);
  bx(x-f.tw/2,top,f.tw,f.th,pal);
  if(dir!=='u'){px(x,top+2,1,1,C.wh);px(x-1,top+3,3,1,C.wh);px(x-2,top+4,5,1,C.wh);}
  if(dir==='d'){drawArm(armL,'L');drawArm(armR,'R');}

  return{cx:x,cy:top-6};
}

    chalkPoly([[140,54],[330,54],[330,210],[140,210],[140,54]],CH,bo+40);chalkPoly([[196,20],[276,20],[276,56],[196,56],[196,20]],CH,bo+41);
    chalkCircle(218,38,6,PK,bo+42);chalkCircle(254,38,6,PK,bo+43);chalkCircle(218,38,3,PK,bo+44);chalkCircle(254,38,3,PK,bo+45);
    chalkPoly([[330,80],[392,150],[380,168]],CH,bo+46);chalkPoly([[140,80],[96,140]],CH,bo+47);
    chalkCircle(372,196,7,CH,bo+48);chalkPoly([[372,203],[370,228]],CH,bo+49);chalkPoly([[370,212],[360,200]],CH,bo+50);chalkPoly([[370,212],[380,200]],CH,bo+51);
    chalkPoly([[330,220],[346,220],[346,232],[330,232],[330,220]],CH,bo+52);
  }
  for(let i=0;i<3;i++)px(W/2-8+i*7,238,4,2,i===mem.i?CH:CH2);
  txt('E',446,238,CH2);
  g.globalAlpha=1;
}
function lightsFrame(){
  const L=[],sx=x=>x-cam.x,sy=y=>y-cam.y,fl=Math.sin(T*.35)*4+Math.sin(T*.13)*3;
  L.push({x:sx(FIRE.x),y:sy(FIRE.y-6),r:78+fl,col:'255,150,60',a:.35});
  L.push({x:sx(pl.x),y:sy(pl.y-14-pl.z),r:40,col:'0,240,255',a:.08});
  for(const gp2 of glowPts)L.push({x:sx(gp2.x),y:sy(gp2.y),r:gp2.r*(1+.08*Math.sin(T*.05+gp2.x)),col:gp2.col,a:gp2.a});
  const tt=props.find(p=>p.kind==='titan');if(tt){const ox=tt.x-tt.ax,oy=tt.y-tt.ay,pu=.6+.4*Math.sin(T*.04);L.push({x:sx(ox+95),y:sy(oy+70),r:22,col:'255,79,176',a:.5*pu});L.push({x:sx(ox+131),y:sy(oy+70),r:22,col:'255,79,176',a:.5*pu});}
  for(const b of beams)L.push({x:sx((b.x0+b.x1)/2),y:sy((b.y0+b.y1)/2),r:60,col:'0,240,255',a:.5*b.t/16});
  for(const b of bombs)if(b.st==='fuse')L.push({x:sx(b.x),y:sy(b.y-6),r:14,col:'255,210,58',a:.5});
  for(const f of flies){const a=.5+.5*Math.sin(T*.07+f.p*3);if(a>.3)L.push({x:sx(f.x),y:sy(f.y),r:8,col:'220,255,120',a:.5*a});}
  for(const e of enemies)if(e.st!=='dormant')L.push({x:sx(e.x),y:sy(e.y-14),r:10,col:'255,210,58',a:.22});
  for(const p of parts)if(p.glow)L.push({x:sx(p.x),y:sy(p.y),r:6,col:'255,200,90',a:.3});
  L.push({x:sx(MEM.x),y:sy(MEM.y-2),r:10,col:'255,45,150',a:.25});
  return L.filter(l=>l.x>-l.r&&l.x<W+l.r&&l.y>-l.r&&l.y<H+l.r);
}
const vign=mk(W,H);{const c=vign.getContext('2d'),gr=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);gr.addColorStop(0,'rgba(8,4,32,0)');gr.addColorStop(1,'rgba(8,4,32,.75)');c.fillStyle=gr;c.fillRect(0,0,W,H);}
const tintC=mk(W,H);{const c=tintC.getContext('2d'),gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#ff3d9a');gr.addColorStop(.55,'#4a3cff');gr.addColorStop(1,'#19d6c8');c.fillStyle=gr;c.fillRect(0,0,W,H);}
const shafts=[{x:430,w:22,p:0},{x:476,w:14,p:1.7},{x:548,w:30,p:3.1},{x:600,w:12,p:4.4},{x:760,w:18,p:2.2}];
function render(){
  const ox=Math.round(cam.x+(shake?rnd(-shake,shake):0)),oy=Math.round(cam.y+(shake?rnd(-shake,shake):0));
  const saveCam={x:cam.x,y:cam.y};cam.x=ox;cam.y=oy;
  g.drawImage(world,ox,oy,W,H,0,0,W,H);
  drawWater();
  for(const p of parts)if(p.ring){for(let a=0;a<40;a++){const aa=a/40*6.283;px(p.x-ox+Math.cos(aa)*p.r,p.y-oy+Math.sin(aa)*p.r*.6,1,1,C.wh);}}
  const list=[],W2=(f)=>()=>{g.save();g.translate(-ox,-oy);f();g.restore();};
  for(const p of props){const x0=p.x-p.ax-ox,y0=p.y-p.ay-oy;if(x0>W||y0>H||x0+p.spr.width<0||y0+p.spr.height<0)continue;list.push({y:p.y,f:()=>{
    let a=1;if(p.fade&&pl.y<p.y&&pl.y>p.y-p.spr.height+4&&Math.abs(pl.x-p.x)<p.spr.width/2)a=.45;
    if(p.kind!=='tree'&&p.kind!=='bush')shadow(p.x-ox,p.y-oy,p.spr.width*.8);
    g.globalAlpha=a;g.drawImage(p.spr,Math.round(x0),Math.round(y0));g.globalAlpha=1;}});}
  list.push({y:FIRE.y,f:W2(drawFire)});
  list.push({y:MEM.y,f:W2(drawMemItem)});
  for(const h of husks)list.push({y:h.y,f:W2(()=>drawHusk(h))});
  for(const k of pickups)list.push({y:k.y,f:W2(()=>drawPickup(k))});
  for(const e of enemies)list.push({y:e.y,f:W2(()=>drawEnemy(e))});
  for(const b of bombs)list.push({y:b.y,f:W2(()=>drawBomb(b))});
  for(const d of debris)list.push({y:d.y,f:W2(()=>{shadow(d.x+d.w/2,d.y,d.w);px(d.x,d.y-d.h-d.z,d.w,d.h,d.c);})});
  list.push({y:pl.y,f:W2(drawPlayer)});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  g.save();g.translate(-ox,-oy);
  for(const b of beams){const k=b.t/16,n=Math.ceil(Math.hypot(b.x1-b.x0,b.y1-b.y0)),w=Math.max(1,Math.round(5*k));for(let i=0;i<=n;i+=1){const x=b.x0+(b.x1-b.x0)*i/n,y=b.y0+(b.y1-b.y0)*i/n;px(x,y-(w>>1),1,w,C.cy);px(x,y,1,1,C.wh);}}
  for(const p of parts){if(p.ring)continue;if(p.splash){px(p.x-1,p.y,1,1,'#b0e8ff');px(p.x+1,p.y,1,1,'#b0e8ff');continue;}px(p.x,p.y,p.s,p.s,p.c);}
  for(const t of texts)if(t.t>6||(T&1)){txt(t.s,t.x+1,t.y+1,C.night,1,'c');txt(t.s,t.x,t.y,t.c,1,'c');}
  g.restore();
  g.globalCompositeOperation='lighter';
  for(const s of shafts){
    const x=s.x-ox,top=-20,bot=PZ.y+PZ.h-oy+10,al=.07+.035*Math.sin(T*.012+s.p);
    if(x>W+80||x<-120)continue;
    const gr=g.createLinearGradient(0,top,0,bot);gr.addColorStop(0,`rgba(200,235,255,${al})`);gr.addColorStop(.8,`rgba(160,220,255,${al*.8})`);gr.addColorStop(1,'rgba(160,220,255,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(x,top);g.lineTo(x+s.w,top);g.lineTo(x+s.w+(bot-top)*.32,bot);g.lineTo(x+(bot-top)*.32,bot);g.closePath();g.fill();
  }
  for(const m of motes){const a=.5+.5*Math.sin(T*.05+m.p);if(a>.4){g.globalAlpha=a*.6;px(m.x,m.y,1,1,'#dff4ff');}}
  for(const f of flies){const a=.5+.5*Math.sin(T*.07+f.p*3);g.globalAlpha=a;px(f.x-ox,f.y-oy,1,1,'#e8ff9a');}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  if(raining){g.globalAlpha=.25;for(const d of drops)px(d.x,d.y,1,d.l,'#a8dcff');g.globalAlpha=1;}
  const L=lightsFrame(),amb=.24*(1-flash*.9);
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,W,H);lg.fillStyle=`rgba(10,6,44,${amb})`;lg.fillRect(0,0,W,H);
  lg.globalCompositeOperation='destination-out';
  for(const l of L){const gr=lg.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);gr.addColorStop(0,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=gr;lg.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2);}
  g.drawImage(lightC,0,0);
  g.globalCompositeOperation='lighter';
  for(const l of L){const gr=g.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);gr.addColorStop(0,`rgba(${l.col},${l.a*.55})`);gr.addColorStop(1,`rgba(${l.col},0)`);g.fillStyle=gr;g.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2);}
  g.globalCompositeOperation='soft-light';g.globalAlpha=.22;g.drawImage(tintC,0,0);g.globalAlpha=1;
  g.globalCompositeOperation='source-over';
  g.drawImage(vign,0,0);
  if(lightning){
    const draw=(pts,w,col)=>{for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],n=Math.ceil(Math.hypot(x1-x0,y1-y0));for(let k=0;k<=n;k++)px(x0+(x1-x0)*k/n-(w>>1),y0+(y1-y0)*k/n,w,1,col);}};
    g.globalCompositeOperation='lighter';g.globalAlpha=.4;draw(lightning.pts,7,'#9fdcff');g.globalAlpha=1;g.globalCompositeOperation='source-over';
    draw(lightning.pts,3,C.wh);lightning.br.forEach(b=>draw(b,1,'#dff4ff'));
  }
  if(flash>.02){g.globalAlpha=flash*.55;px(0,0,W,H,'#e6f4ff');g.globalAlpha=1;}
  if(redFlash>.02){g.globalAlpha=redFlash*.35;px(0,0,W,H,C.red);g.globalAlpha=1;}
  drawHud();
  drawMemory();
  cam.x=saveCam.x;cam.y=saveCam.y;
  vx.drawImage(scene,0,0);
}
function promptText(){
  const p=pl;if(mem||p.state==='dead'||!started)return null;
  const f=frameDef();
  if(f){if(p.frame.shell<f.shell*.35)return 'E: EJECT';if(p.scrap>0&&p.frame.shell<f.shell&&p.state!=='repair')return 'HOLD H: REPAIR';}
  else{const h=husks.find(h=>Math.hypot(h.x-p.x,h.y-p.y)<20);if(h)return 'E: NEST INTO FRAME '+FRAMES[h.type].code;}
  if(Math.hypot(FIRE.x-p.x,FIRE.y-p.y)<28)return 'E: REST';
  if(Math.hypot(MEM.x-p.x,MEM.y-p.y)<18)return 'E: REMEMBER';
  return null;
}
function drawHud(){
  const x0=8,y0=8,f=frameDef();
  txt('CORE',x0,y0,C.yl);for(let i=0;i<pl.coreMax;i++)px(x0+20+i*7,y0,5,5,i<pl.core?C.yl:'#3a3010');
  if(f){txt('FRAME '+f.code+' '+f.name,x0,y0+9,C.cy);const fr=Math.max(0,pl.frame.shell)/f.shell;px(x0,y0+16,70,3,'#0b2a3a');px(x0,y0+16,Math.round(70*fr),3,fr<.35?C.m3:C.cy);}
  else txt('NO FRAME',x0,y0+9,C.s1);
  const eq=equipped();
  pl.parts.forEach((pt,i)=>{const on=eq.includes(pt),x=x0+i*10,y=y0+23;px(x,y,9,9,on?PARTS[pt].col:C.s0);px(x+1,y+1,7,7,C.night);drawPartIcon(pt,x+1,y+1,on);});
  if(eq.includes('laser')&&pl.laserCd>0){px(x0,y0+34,30,2,'#0b2a3a');px(x0,y0+34,Math.round(30*(1-pl.laserCd/150)),2,C.cy);}
  const sx=W-10;px(sx-3,y0,5,5,C.s1);px(sx-2,y0+1,3,3,C.night);px(sx-1,y0+2,1,1,C.s3);txt(String(pl.scrap),sx-7,y0,C.s2,1,'r');
  const pr=promptText();
  if(pr){const w=textW(pr)+10;g.globalAlpha=.8;px(W/2-w/2,H-20,w,11,C.night);g.globalAlpha=1;px(W/2-w/2,H-20,w,1,C.t1);txt(pr,W/2,H-17,C.t3,1,'c');}
  if(pl.state==='dead'){g.globalAlpha=Math.min(1,pl.deadT/40)*.85;px(0,0,W,H,C.night);g.globalAlpha=1;if(pl.deadT>30){txt('SIGNAL LOST',W/2+1,H/2-9,C.m2,3,'c');txt('SIGNAL LOST',W/2,H/2-10,C.cy,3,'c');}}
  if(!started||titleT<90){
    const a=started?Math.max(0,1-titleT/90):1;if(started)titleT++;
    if(a>0){g.globalAlpha=a;px(0,H/2-34,W,70,C.night);g.globalAlpha=a*.95;
      txt('ONION HEAD',W/2+1,H/2-25,C.m2,4,'c');txt('ONION HEAD',W/2,H/2-26,C.cy,4,'c');
      txt('TOP-DOWN TEST',W/2,H/2+2,C.m3,1,'c');txt(touch?'MOVE TO BEGIN':'MOVE OR PRESS ANY BUTTON',W/2,H/2+18,C.s2,1,'c');g.globalAlpha=1;}
  }
}

function fit(){const r=stage.getBoundingClientRect(),aw=r.width-16,ah=r.height-16;let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s);s=Math.max(1,s);view.style.width=Math.round(W*s)+'px';view.style.height=Math.round(H*s)+'px';}
addEventListener('resize',fit);fit();
cam.x=clamp(pl.x-W/2,0,WW-W);cam.y=clamp(pl.y-H/2,0,WH-H);
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){step();acc-=1000/60;n++;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
